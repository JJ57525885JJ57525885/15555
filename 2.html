<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>关于 - 赛博打工鲸</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(145deg, #2c3e50, #1a252f);
            font-family: sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .info {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .version {
            color: #ffcc00;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .update-hint {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐳 赛博打工鲸</h1>
        <div class="info">
            深海饲养员 - 一款可爱的虎鲸养成游戏<br>
            照顾你的专属虎鲸，一起冒险吧！
        </div>
        <div class="version" id="version-text">版本：2.0</div>
        <button class="btn" id="download-btn" onclick="downloadApp()">📥 下载应用</button>
        <div class="update-hint" id="update-hint">检测到新版本可用！</div>
    </div>

    <script>
        const CURRENT_VERSION = '1.0';
        const ASSET_BASE_URL = 'https://jj57525885jj57525885.github.io/15555/';

        // 显示当前版本并检查更新
        document.getElementById('version-text').textContent = '版本：' + CURRENT_VERSION;

        function checkForUpdate() {
            // 模拟获取最新版本号（可替换为 fetch 请求真实数据）
            const latestVersion = '2.0';
            const downloadBtn = document.getElementById('download-btn');
            const updateHint = document.getElementById('update-hint');
            if (latestVersion !== CURRENT_VERSION) {
                downloadBtn.textContent = '🔄 更新到 ' + latestVersion;
                updateHint.style.display = 'block';
                updateHint.textContent = '当前版本 ' + CURRENT_VERSION + '，最新版本 ' + latestVersion + ' 可用！';
            } else {
                downloadBtn.textContent = '📥 下载应用';
                updateHint.style.display = 'none';
            }
        }

        function downloadApp() {
            const latestVersion = '2.0';
            const apkUrl = ASSET_BASE_URL + 'v' + latestVersion + '.apk';
            alert('正在下载 ' + apkUrl + ' ...');
            const link = document.createElement('a');
            link.href = apkUrl;
            link.download = apkUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 页面加载时检查更新
        checkForUpdate();
    </script>
</body>
</html>
